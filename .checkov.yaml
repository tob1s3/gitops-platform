# Осознанные исключения. Всё остальное, что найдёт checkov, роняет CI.
skip-check:
  # Namespace задаётся при развёртывании (destination в Argo CD), а не в шаблонах чарта.
  - CKV_K8S_21
  # CPU-лимиты не ставим намеренно: они вызывают throttling даже при свободном CPU на узле.
  # Память ограничена (limits.memory), CPU гарантирован requests.
  - CKV_K8S_11
  # Digest включается в environments/production при выпуске; тег в staging нужен для быстрых итераций.
  - CKV_K8S_43
  # При фиксации по digest политика скачивания не влияет на то, какой образ запустится.
  - CKV_K8S_15
  # Terraform: локальный kind-кластер для разработки и e2e, а не облачная инфраструктура.
  - CKV_TF_1
quiet: true
compact: true
